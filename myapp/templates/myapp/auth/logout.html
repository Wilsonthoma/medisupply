{% extends "myapp/base.html" %}
{% load static %}

{% block title %}Signed Out{% endblock %}

{% block auth_content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      <div class="ms-auth-card text-center">
        <div class="ms-auth-header">
          <span class="ms-auth-code">MEDISUPPLY</span>
          <h1 class="ms-auth-title">Signed Out</h1>
          <p class="ms-auth-subtitle">Your session has ended.</p>
        </div>
        <div class="ms-auth-body">
          <a href="{% url 'login' %}" class="btn ms-btn-primary w-100">Sign In Again</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
